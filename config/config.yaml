seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  interim_dir: data/interim
  image_size: [224, 224]
  batch_size: 32
  num_workers: 4
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  classes: [ok, defective]

model:
  architecture: resnet18
  pretrained: true
  num_classes: 2
  checkpoint_dir: models/checkpoints

training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  scheduler: reduce_on_plateau
  scheduler_factor: 0.5     # LR multiplier applied on plateau
  scheduler_patience: 3     # epochs of no val_loss improvement before reducing LR
  early_stopping_patience: 10
  device: cuda

inference:
  threshold: 0.5
  output_dir: outputs/predictions

logging:
  log_dir: outputs/logs
  log_interval: 10
