seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  interim_dir: data/interim
  image_size: [224, 224]
  batch_size: 32
  num_workers: 4
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  classes: [ok, defective]

model:
  architecture: resnet18
  pretrained: true
  num_classes: 2
  checkpoint_dir: models/checkpoints

training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  scheduler: reduce_on_plateau
  scheduler_factor: 0.5     # LR multiplier applied on plateau
  scheduler_patience: 3     # epochs of no val_loss improvement before reducing LR
  early_stopping_patience: 10
  device: cuda

inference:
  threshold: 0.5
  output_dir: outputs/predictions

logging:
  log_dir: outputs/logs
  log_interval: 10

disposition:
  # Confidence at/above which the Disposition Agent trusts the Inspection
  # Agent's label enough to make an automated accept/rework/scrap call;
  # below it, the case is escalated for human review regardless of label.
  # See src.agents.disposition_agent module docstring: authored policy,
  # not fitted to any historical disposition-outcome data.
  high_confidence_threshold: 0.90

trend:
  # Recent-window defect_rate above which drift_flag is raised, and the
  # max number of recent per-batch records that window is computed over.
  # See src.agents.trend_agent module docstring: batch_id/timestamp are
  # SIMULATED (this dataset has no real batch/line/timestamp metadata) --
  # these numbers are an authored demonstration threshold, not fitted to
  # real production drift data.
  drift_threshold: 0.5
  window_size: 20
